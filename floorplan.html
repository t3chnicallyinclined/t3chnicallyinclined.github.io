<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floorplan · Tristan Rega</title>
<meta name="description" content="A map of a repository for a first-time reader: its parts, how they connect, and where to start reading.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c09'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='%23c6f432'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<script>
/* Same theme choice as the home page (shared localStorage), applied before first paint. */
try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
/* Opened inside the home page's panel: that panel already has the title and the controls. */
try { if (window.top !== window.self) document.documentElement.classList.add("embedded"); } catch (e) { document.documentElement.classList.add("embedded"); }
</script>
<style>
:root{
  --bg:#f2f1ea; --panel:#fbfaf5; --line:#d8d6ca; --fg:#14150f; --muted:#565849; --faint:#85877a;
  --accent:#c6f432; --accent-ink:#14150f; --link:#3d5800; --code:#ecebe2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0c09; --panel:#12140f; --line:#272a20; --fg:#edece4; --muted:#a3a595; --faint:#6e7062;
    --accent:#c6f432; --accent-ink:#0b0c09; --link:#c6f432; --code:#1a1c16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0c09; --panel:#12140f; --line:#272a20; --fg:#edece4; --muted:#a3a595; --faint:#6e7062;
  --accent:#c6f432; --accent-ink:#0b0c09; --link:#c6f432; --code:#1a1c16; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:16px; line-height:1.62; -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0 72px}
a{color:var(--link)}
a:focus-visible,button:focus-visible{outline:2px solid var(--link); outline-offset:3px; border-radius:4px}
::selection{background:var(--accent); color:var(--accent-ink)}

.topbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; padding-block:18px; font-family:var(--mono); font-size:12.5px; color:var(--muted)}
.topbar a{color:var(--fg); text-decoration:none}
.topbar a:hover{text-decoration:underline; text-underline-offset:3px}
.tabs{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 0}
.tabs a{font-family:var(--mono); font-size:12.5px; color:var(--fg); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:6px 13px; background:var(--panel)}
.tabs a[aria-current="page"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.kicker{margin:34px 0 4px; font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
.status{font-family:var(--mono); font-size:12.5px; color:var(--faint); margin:12px 0 0}

article{margin-top:8px}
article h1{font-family:var(--display); font-weight:800; font-size:clamp(36px,7vw,64px); line-height:.95; letter-spacing:-.04em; margin:6px 0 18px; text-wrap:balance}
article h2{font-family:var(--display); font-weight:700; font-size:clamp(22px,3.2vw,28px); letter-spacing:-.02em; margin:48px 0 12px; padding-top:14px; border-top:1px solid var(--line); text-wrap:balance}
article h3{font-family:var(--display); font-weight:700; font-size:19px; margin:28px 0 8px}
article p, article li{max-width:72ch}
article p{margin:0 0 14px}
article ul, article ol{padding-left:1.3em; margin:0 0 16px}
article li{margin:4px 0}
article code{font-family:var(--mono); font-size:.86em; background:var(--code); border-radius:4px; padding:.1em .35em}
article pre{background:var(--code); border-radius:10px; padding:14px 16px; overflow-x:auto; font-size:13.5px; line-height:1.5}
article pre code{background:none; padding:0}
article strong{font-weight:600}
article blockquote{margin:0 0 16px; padding:2px 16px; border-left:3px solid var(--accent); color:var(--muted)}
.table{overflow-x:auto; margin:0 0 18px; border:1px solid var(--line); border-radius:12px; background:var(--panel)}
article table{border-collapse:collapse; width:100%; font-size:14.5px; line-height:1.5}
article th, article td{text-align:left; vertical-align:top; padding:10px 14px; border-bottom:1px solid var(--line)}
article tr:last-child td{border-bottom:0}
article th{font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:600}
article td:first-child{white-space:nowrap; font-weight:500}
.diagram{overflow-x:auto; margin:6px 0 22px; padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--panel); text-align:center}
.diagram svg{max-width:none; height:auto}
.foot{margin-top:56px; padding-top:16px; border-top:1px solid var(--line); font-family:var(--mono); font-size:12.5px; color:var(--faint); display:flex; flex-wrap:wrap; gap:8px 20px}
@media (max-width:560px){ article td:first-child{white-space:normal} }
.embedded .topbar, .embedded .tabs, .embedded .kicker{display:none}
.embedded .wrap{padding-block:8px 48px}
@media print{
  :root{--bg:#fff; --panel:#fff; --line:#c7cad0; --fg:#000; --muted:#2b2e33; --faint:#555b63; --link:#000; --code:#f2f2f2; color-scheme:light}
  .topbar,.tabs,.status,.foot{display:none}
  .wrap{max-width:none; padding:0}
  article h2{break-after:avoid}
  .diagram,.table{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="./">← t3chnicallyinclined.github.io</a>
    <span id="src"></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="Repositories"></nav>
  <p class="kicker">Floorplan</p>
  <p class="status" id="status">Loading…</p>
  <article id="doc"></article>
  <div class="foot">
    <span>Rendered from <code>docs/FLOORPLAN.md</code> in the repository, fetched when you open this page.</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function () {
  "use strict";
  var USER = "t3chnicallyinclined";
  var REPOS = [
    { repo: "GP2040-CE-NOBD", name: "NOBD firmware", branch: "main" },
    { repo: "nobd-desktop", name: "nobd-desktop", branch: "master" },
    { repo: "mvc2-oracle", name: "mvc2-oracle", branch: "master" },
    { repo: "mvc2-skin-studio", name: "mvc2-skin-studio", branch: "master" }
  ];
  var $ = function (id) { return document.getElementById(id); };

  // Which repository: #<repo> (a plain hash survives every link shape), default the first.
  var wanted = decodeURIComponent((location.hash || "").slice(1));
  var cur = REPOS.filter(function (r) { return r.repo === wanted; })[0] || REPOS[0];

  $("tabs").innerHTML = REPOS.map(function (r) {
    return '<a href="#' + r.repo + '"' + (r === cur ? ' aria-current="page"' : "") + ">" + r.name + "</a>";
  }).join("");
  window.addEventListener("hashchange", function () { location.reload(); });

  var blobBase = "https://github.com/" + USER + "/" + cur.repo + "/blob/" + cur.branch + "/";
  var rawUrl = "https://raw.githubusercontent.com/" + USER + "/" + cur.repo + "/" + cur.branch + "/docs/FLOORPLAN.md";
  $("src").innerHTML = '<a href="' + blobBase + 'docs/FLOORPLAN.md">view on GitHub ↗</a>';
  document.title = cur.name + " floorplan · Tristan Rega";

  var dark = (function () {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  })();
  mermaid.initialize({
    startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "neutral",
    // A system font for diagrams: labels are measured when drawn, and a web font that loads later
    // would make them overflow their boxes.
    fontFamily: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif', fontSize: 15,
    flowchart: { htmlLabels: true, curve: "basis" }
  });

  // Mermaid blocks become placeholders; everything else is ordinary markdown.
  var renderer = new marked.Renderer();
  var diagrams = [];
  renderer.code = function (code, lang) {
    var text = typeof code === "object" ? code.text : code;
    var language = typeof code === "object" ? code.lang : lang;
    if (language === "mermaid") {
      diagrams.push(text);
      return '<div class="diagram" data-d="' + (diagrams.length - 1) + '"></div>';
    }
    var esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return "<pre><code>" + esc + "</code></pre>";
  };
  renderer.table = function (header, body) {
    if (typeof header === "object") return false;  // newer marked: fall back to default
    return '<div class="table"><table><thead>' + header + "</thead><tbody>" + body + "</tbody></table></div>";
  };

  fetch(rawUrl).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function (md) {
    var html = marked.parse(md, { renderer: renderer, gfm: true });
    $("doc").innerHTML = DOMPurify.sanitize(html, { ADD_ATTR: ["data-d"] });
    // Wrap any table the renderer did not wrap, so wide tables scroll inside the page.
    Array.prototype.forEach.call(document.querySelectorAll("article table"), function (t) {
      if (t.parentNode.className !== "table") {
        var w = document.createElement("div"); w.className = "table";
        t.parentNode.insertBefore(w, t); w.appendChild(t);
      }
    });
    // Relative links point into the repository on GitHub.
    Array.prototype.forEach.call(document.querySelectorAll("article a[href]"), function (a) {
      var h = a.getAttribute("href");
      if (!/^([a-z]+:|#|\/\/)/i.test(h)) a.href = blobBase + "docs/" + h;
      a.target = "_blank"; a.rel = "noopener";
    });
    $("status").textContent = "";
    return (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve());
  }).then(function () {
    var nodes = document.querySelectorAll(".diagram");
    var jobs = Array.prototype.map.call(nodes, function (el, i) {
      return mermaid.render("fp" + i, diagrams[+el.getAttribute("data-d")]).then(function (out) {
        el.innerHTML = out.svg;
        // Readable size: fill the column, but never shrink a wide diagram below 75% of its drawn
        // size; past that it scrolls sideways inside its box instead.
        var svg = el.querySelector("svg"), vb = svg && svg.viewBox && svg.viewBox.baseVal;
        if (vb && vb.width) {
          var avail = el.clientWidth - 36;
          svg.removeAttribute("width");
          svg.style.maxWidth = "none";
          svg.style.width = Math.round(Math.min(vb.width, Math.max(avail, vb.width * 0.75))) + "px";
        }
      }).catch(function () {
        el.innerHTML = "<pre><code></code></pre>";
        el.querySelector("code").textContent = diagrams[+el.getAttribute("data-d")];
      });
    });
    return Promise.all(jobs);
  }).catch(function () {
    $("status").innerHTML = 'Could not load the floorplan right now. <a href="' + blobBase + 'docs/FLOORPLAN.md">Read it on GitHub ↗</a>';
  });
})();
</script>
</body>
</html>
